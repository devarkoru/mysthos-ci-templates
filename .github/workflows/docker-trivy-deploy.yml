name: Reusable Docker + Trivy + GHCR + SSH Deploy

on:
  workflow_call:
    inputs:
      compose_dir:
        description: "Directorio en la VM donde vive el docker-compose.yml"
        required: true
        type: string
      compose_files:
        description: "Flags -f para docker compose (ej. '-f docker-compose.yml -f docker-compose.prod.yml')"
        required: false
        type: string
        default: "-f docker-compose.yml"
      service_name:
        description: "Nombre del servicio en docker-compose.yml a actualizar"
        required: true
        type: string
      trivy_exit_code:
        description: "Código de salida de Trivy ('0' solo reporta, '1' bloquea el deploy)"
        required: false
        type: string
        default: "0"
      trivy_severity:
        description: "Severidades a escanear con Trivy"
        required: false
        type: string
        default: "CRITICAL,HIGH"
    secrets:
      VM_HOST:
        required: true
      VM_USER:
        required: true
      VM_SSH_KEY:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (local for Trivy scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: ${{ inputs.trivy_exit_code }}
          ignore-unfixed: true
          severity: ${{ inputs.trivy_severity }}

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy service to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ inputs.compose_dir }}
            docker compose ${{ inputs.compose_files }} pull ${{ inputs.service_name }}
            docker compose ${{ inputs.compose_files }} up -d ${{ inputs.service_name }}
            docker image prune -f
